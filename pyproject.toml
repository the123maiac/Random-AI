[project]
name = "agentic-chat"
version = "0.1.0"
description = "BYO-key agentic chat for a small trusted group"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "python-multipart>=0.0.12",
    "itsdangerous>=2.2",
    "bcrypt>=4.2",
    "cryptography>=43",
    "keyring>=25",
    "httpx>=0.27",
    "openai>=1.54",
    "anthropic>=0.39",
    "google-genai>=0.3",
    "apscheduler>=3.10",
    "firecrawl-py>=1.6",
    "numpy>=1.26",
    "readability-lxml>=0.8",
    "lxml[html_clean]>=5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
agentic-chat = "app.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
